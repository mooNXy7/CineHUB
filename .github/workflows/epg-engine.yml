name: CineHUB EPG Engine

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "CineHUB_Data/tools/build_epg.py"
      - "CineHUB_Data/sources/registry.json"
      - ".github/workflows/epg-engine.yml"
  workflow_run:
    workflows: ["CineHUB Data Engine - Health Check diário"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: cinehub-epg-engine
  cancel-in-progress: false

jobs:
  epg:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore EPG processed cache
        uses: actions/cache@v4
        with:
          path: CineHUB_Data/.cache/epg
          key: cinehub-epg-${{ runner.os }}-${{ hashFiles('CineHUB_Data/sources/registry.json') }}
          restore-keys: |
            cinehub-epg-${{ runner.os }}-

      - name: Validate EPG engine
        run: |
          python3 -m py_compile CineHUB_Data/tools/build_epg.py
          python3 -m py_compile CineHUB_Data/tools/test_build_epg.py
          python3 -m json.tool CineHUB_Data/sources/registry.json >/dev/null
          if [ -f CineHUB_Data/resolved/channels.json ]; then
            python3 -m json.tool CineHUB_Data/resolved/channels.json >/dev/null
          else
            echo "Canonical channel index not published yet; EPG will use stable source IDs."
          fi
      - name: Run EPG unit tests
        working-directory: CineHUB_Data/tools
        run: python3 -m unittest test_build_epg.py -v

      - name: Build EPG
        run: python3 CineHUB_Data/tools/build_epg.py

      - name: Show EPG status
        run: |
          python3 - <<'PY'
          import json
          p="CineHUB_Data/status/epg-status.json"
          try:
              s=json.load(open(p,encoding="utf-8"))
              print("EPG status:", s.get("status"))
              print("Sources:", s.get("stats",{}).get("sourcesConfigured"))
              print("Healthy:", s.get("stats",{}).get("sourcesHealthy"))
              print("Failed:", s.get("stats",{}).get("sourcesFailed"))
              print("Cache hits:", s.get("stats",{}).get("cacheHits"))
              print("Network fetches:", s.get("stats",{}).get("networkFetches"))
              print("Channels with EPG:", s.get("stats",{}).get("channelsWithPrograms"))
              print("Programs:", s.get("stats",{}).get("programs"))
          except Exception as e:
              print("EPG status unavailable:", e)
          PY

      - name: Build public EPG package
        run: |
          set -euo pipefail
          mkdir -p CineHUB_WEB/data-engine/epg
          cp CineHUB_Data/epg/schedule.index.json CineHUB_WEB/data-engine/epg/schedule.index.json
          cp CineHUB_Data/status/epg-status.json CineHUB_WEB/data-engine/epg/status.json

      - name: Publish generated EPG data
        run: |
          git config user.name "CineHUB Data Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CineHUB_Data/epg/schedule.index.json CineHUB_Data/status/epg-status.json CineHUB_WEB/data-engine/epg/epg
          if git diff --cached --quiet; then
            echo "NO CHANGES"
            exit 0
          fi
          git commit -m "data: update EPG manifest"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            git add CineHUB_Data/epg/schedule.index.json CineHUB_Data/status/epg-status.json CineHUB_WEB/data-engine
            if git diff --cached --quiet; then
              echo "EPG changes were already published by another run"
              exit 0
            fi
          done
          echo "Failed to publish EPG changes after 3 attempts"
          exit 1
