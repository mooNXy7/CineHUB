name: CineHUB Data Engine - Health Check diario

on:
  push:
    paths:
      - "CineHUB_WEB/dados/conteudo/catalogo/**"
      - "CineHUB_Data/tools/**"
      - ".github/workflows/cinehub-data-update.yml"
  schedule:
    # Temporary validation cadence; restored to daily after the first green run.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["CineHUB EPG Engine"]
    types: [completed]

concurrency:
  group: cinehub-data-engine
  cancel-in-progress: false

env:
  GIT_TERMINAL_PROMPT: "0"

permissions:
  contents: write

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Data Layer
        shell: bash
        run: |
          set -euo pipefail
          test -f CineHUB_Data/sources/registry.json
          test -f CineHUB_Data/manifests/data-manifest.json
          test -f CineHUB_Data/status/data-status.json
          python3 -m json.tool CineHUB_Data/sources/registry.json >/dev/null
          python3 -m json.tool CineHUB_Data/manifests/data-manifest.json >/dev/null
          python3 -m json.tool CineHUB_Data/status/data-status.json >/dev/null
          python3 -m py_compile CineHUB_Data/tools/update_data.py
          python3 -m py_compile CineHUB_Data/tools/health_check.py
          python3 -m py_compile CineHUB_Data/tools/normalize_channels.py
          python3 -m py_compile CineHUB_Data/tools/resolve_sources.py
          python3 -m py_compile CineHUB_Data/tools/build_vod_catalog.py
          python3 -m py_compile CineHUB_Data/tools/build_series_index.py
      - name: Run Data Engine health check
        run: python3 CineHUB_Data/tools/health_check.py
      - name: Normalize channels
        run: python3 CineHUB_Data/tools/normalize_channels.py
      - name: Resolve multi-source fallback
        run: python3 CineHUB_Data/tools/resolve_sources.py
      - name: Build VOD catalog indexes
        run: python3 CineHUB_Data/tools/build_vod_catalog.py
      - name: Build explicit series and episode indexes
        run: python3 CineHUB_Data/tools/build_series_index.py
      - name: Validate publication tool
        run: |
          python3 -m py_compile CineHUB_Data/tools/publish_data.py
          python3 -m py_compile CineHUB_Data/tools/test_publish_data.py
          (cd CineHUB_Data/tools && python3 -m unittest test_publish_data.py -v)
      - name: Build public Data Engine package
        run: python3 CineHUB_Data/tools/publish_data.py
      - name: Show result
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("CineHUB_Data/status/data-status.json", encoding="utf-8"))
          print("Data Engine status:", d.get("status"))
          print("Sources checked:", d.get("sources", {}).get("checked"))
          print("Sources changed:", d.get("sources", {}).get("changed"))
          print("Source errors:", d.get("sources", {}).get("errors"))
          try:
            n=json.load(open("CineHUB_Data/normalized/channels.json", encoding="utf-8"))
            print("Normalized channels:", n.get("stats", {}).get("entities"))
            print("Merged duplicates:", n.get("stats", {}).get("duplicatesMerged"))
            print("Normalization source failures:", n.get("stats", {}).get("failedSources"))
          except Exception as e:
            print("Normalized channels: unavailable", e)
          try:
            v=json.load(open("CineHUB_Data/catalog/metadata.json", encoding="utf-8"))
            print("VOD items:", v.get("stats", {}).get("items"))
            print("VOD movies:", v.get("stats", {}).get("movies"))
            print("VOD series:", v.get("stats", {}).get("series"))
            print("VOD series entities:", v.get("stats", {}).get("seriesEntities"))
            print("VOD episodes:", v.get("stats", {}).get("episodes"))
          except Exception as e:
            print("VOD catalog: unavailable", e)
          try:
            r=json.load(open("CineHUB_Data/resolved/channels.json", encoding="utf-8"))
            print("Resolved channels:", r.get("stats", {}).get("entitiesPublished"))
            print("Fallback chains:", r.get("stats", {}).get("fallbackChains"))
            print("Resolved offline sources:", r.get("stats", {}).get("sourcesOffline"))
          except Exception as e:
            print("Resolved channels: unavailable", e)
          PY
      - name: Commit only when data changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CineHUB_Data; then
            echo "NO CHANGES"
            exit 0
          fi
          git config user.name "CineHUB Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never commit the full normalized/resolved channel graphs or raw
          # build caches. They can exceed GitHub's 100 MB object limit.
          git add \
            CineHUB_Data/sources/registry.json \
            CineHUB_Data/status/data-status.json \
            CineHUB_Data/catalog/catalog-manifest.json \
            CineHUB_Data/catalog/movies.index.json \
            CineHUB_Data/catalog/series.entities.json \
            CineHUB_Data/catalog/featured.json \
            CineHUB_Data/catalog/trending.json \
            CineHUB_Data/catalog/releases.json \
            CineHUB_Data/catalog/metadata.json \
            CineHUB_WEB/data-engine
          if git diff --cached --quiet; then
            echo "NO CHANGES"
            exit 0
          fi
          git commit -m "chore(data): refresh published datasets"
          # Discard generated build-only files that are intentionally not stored
          # in GitHub (large normalized/resolved graphs and episode indexes).
          git restore --worktree -- CineHUB_Data/normalized CineHUB_Data/resolved \
            CineHUB_Data/catalog/series.index.json CineHUB_Data/catalog/episodes.index.json 2>/dev/null || true
          git clean -fd -- CineHUB_Data/tools/__pycache__ 2>/dev/null || true
          mkdir -p CineHUB_WEB/data-engine
          cat > CineHUB_WEB/data-engine/_headers <<'EOF'
/data-engine/manifest.json
  Cache-Control: no-cache, max-age=0, must-revalidate
/data-engine/status-public.json
  Cache-Control: no-cache, max-age=0, must-revalidate
/data-engine/*
  Cache-Control: public, max-age=60, stale-while-revalidate=300
EOF
          git add CineHUB_WEB/data-engine/_headers
          git commit --amend --no-edit
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "Failed to publish generated Data Engine changes after 3 attempts"
          exit 1
