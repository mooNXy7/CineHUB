name: Import CineIDV visuals

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract CineIDV
        run: |
          set -e
          curl -L --fail --retry 3 "https://github.com/mooNXy7/CineHUB/raw/main/CineIDV.zip" -o /tmp/CineIDV.zip
          rm -rf /tmp/CineIDV
          mkdir -p /tmp/CineIDV
          unzip -q /tmp/CineIDV.zip -d /tmp/CineIDV
          find /tmp/CineIDV -type f -print
      - name: Import visuals
        run: |
          set -e
          mkdir -p CineHUB_Assets
          find /tmp/CineIDV -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) -exec cp -f {} CineHUB_Assets/ \;
          test -n "$(find CineHUB_Assets -type f -size +0c -print -quit)"
      - name: Commit visuals and remove ZIP
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CineHUB_Assets
          git rm CineIDV.zip
          git commit -m "chore: import CineHUB visual identity assets"
          git push
