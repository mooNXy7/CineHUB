name: CineHUB-TV Android Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build release APK
        working-directory: CineHUB_TV_Android
        run: gradle :CineHUB-TV:assembleRelease --no-daemon --stacktrace
      - name: Locate APK
        run: |
          APK="$(find CineHUB_TV_Android/CineHUB-TV/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
      - name: Prepare release asset
        run: |
          mkdir -p release
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$APK" "release/CineHUB-TV-v${VERSION}.apk"
          sha256sum "release/CineHUB-TV-v${VERSION}.apk" > release/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          name: CineHUB TV ${{ github.ref_name }}
          files: |
            release/CineHUB-TV-*.apk
            release/SHA256SUMS.txt
          generate_release_notes: true
