name: CineHUB-TV Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build release APK
        working-directory: CineHUB_TV_Android
        run: gradle :CineHUB-TV:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: test -s CineHUB_TV_Android/CineHUB-TV/build/outputs/apk/release/CineHUB-TV-release.apk
      - name: Prepare release asset
        run: |
          mkdir -p release
          cp CineHUB_TV_Android/CineHUB-TV/build/outputs/apk/release/CineHUB-TV-release.apk "release/CineHUB-TV-$GITHUB_REF_NAME.apk"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/CineHUB-TV-${{ github.ref_name }}.apk
          generate_release_notes: true
