name: CineHUB Data Engine - Publisher

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "CineHUB_Data/tools/**"
      - "CineHUB_Data/sources/registry.json"
      - "CineHUB_WEB/dados/conteudo/catalogo/**"
      - ".github/workflows/data-engine-publisher.yml"

concurrency:
  group: cinehub-data-engine-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Data Engine
        run: |
          set -euo pipefail
          python3 -m json.tool CineHUB_Data/sources/registry.json >/dev/null
          python3 -m json.tool CineHUB_Data/manifests/data-manifest.json >/dev/null
          python3 -m json.tool CineHUB_Data/status/data-status.json >/dev/null
          python3 -m py_compile CineHUB_Data/tools/*.py
          (cd CineHUB_Data/tools && python3 -m unittest discover -p "test_*.py" -v)

      - name: Run Data Engine
        run: |
          set -euo pipefail
          python3 CineHUB_Data/tools/health_check.py
          python3 CineHUB_Data/tools/normalize_channels.py
          python3 CineHUB_Data/tools/resolve_sources.py
          python3 CineHUB_Data/tools/build_vod_catalog.py
          python3 CineHUB_Data/tools/build_series_index.py
          python3 CineHUB_Data/tools/publish_data.py

      - name: Show result
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("CineHUB_Data/status/data-status.json", encoding="utf-8"))
          print("Data Engine:", d.get("status"))
          print("Sources:", d.get("sources", {}))
          print("Catalog:", d.get("catalog", {}))
          PY

      - name: Publish compact datasets
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree -- CineHUB_Data/normalized CineHUB_Data/resolved CineHUB_Data/catalog/series.index.json CineHUB_Data/catalog/episodes.index.json 2>/dev/null || true
          git clean -fd -- CineHUB_Data/tools/__pycache__ 2>/dev/null || true

          mkdir -p CineHUB_WEB/data-engine
          printf '%s\n' \
            '/data-engine/manifest.json' \
            '  Cache-Control: no-cache, max-age=0, must-revalidate' \
            '/data-engine/status-public.json' \
            '  Cache-Control: no-cache, max-age=0, must-revalidate' \
            '/data-engine/*' \
            '  Cache-Control: public, max-age=60, stale-while-revalidate=300' \
            > CineHUB_WEB/data-engine/_headers

          git add CineHUB_Data/sources/registry.json CineHUB_Data/status/data-status.json CineHUB_Data/catalog/catalog-manifest.json CineHUB_Data/catalog/movies.index.json CineHUB_Data/catalog/series.entities.json CineHUB_Data/catalog/featured.json CineHUB_Data/catalog/trending.json CineHUB_Data/catalog/releases.json CineHUB_Data/catalog/metadata.json CineHUB_WEB/data-engine

          if git diff --cached --quiet; then
            echo "NO CHANGES"
            exit 0
          fi

          git config user.name "CineHUB Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh published datasets"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "PUBLISHED"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done

          echo "Failed to publish Data Engine after 3 attempts"
          exit 1
