name: Integrate CineHUB WEB

on:
  push:
    branches: [main]
    paths:
      - 'CineHUB_OFC-PT1.zip'
      - 'CineHUB_OFC-PT2.zip'
      - '.cinehub_web_start'
      - '.github/workflows/integrate-cinehub-web.yml'
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request_target') && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Guard source ZIPs
        run: |
          set -euo pipefail
          test -f CineHUB_OFC-PT1.zip
          test -f CineHUB_OFC-PT2.zip
          test -d CineHUB_TV_Android

      - name: Extract WEB parts
        run: |
          set -euo pipefail
          rm -rf /tmp/web_parts
          mkdir -p /tmp/web_parts/pt1 /tmp/web_parts/pt2
          unzip -q CineHUB_OFC-PT1.zip -d /tmp/web_parts/pt1
          unzip -q CineHUB_OFC-PT2.zip -d /tmp/web_parts/pt2

      - name: Normalize source roots
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          def normalize(src, dst):
              forced=src/'CineHUB_1.1'
              if forced.is_dir():
                  root=forced
              else:
                  entries=[p for p in src.iterdir()]
                  root=entries[0] if len(entries)==1 and entries[0].is_dir() else src
              dst.mkdir(parents=True, exist_ok=True)
              for p in root.iterdir():
                  out=dst/p.name
                  if p.is_dir():
                      shutil.copytree(p,out,dirs_exist_ok=True)
                  else:
                      shutil.copy2(p,out)

          normalize(Path('/tmp/web_parts/pt1'), Path('/tmp/web_parts/n1'))
          normalize(Path('/tmp/web_parts/pt2'), Path('/tmp/web_parts/n2'))
          PY

      - name: Compare and integrate without silent overwrite
        run: |
          set -euo pipefail
          rm -rf CineHUB_WEB
          mkdir -p CineHUB_WEB
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, json

          dest=Path('CineHUB_WEB')
          report={'pt1_added':[],'pt2_added':[],'identical':[],'conflicts':[]}

          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def merge(src,label):
              for p in sorted(src.rglob('*')):
                  if not p.is_file():
                      continue
                  rel=p.relative_to(src)
                  out=dest/rel
                  out.parent.mkdir(parents=True,exist_ok=True)
                  if out.exists():
                      incoming=sha(p)
                      existing=sha(out)
                      if existing==incoming:
                          report['identical'].append(str(rel))
                      else:
                          report['conflicts'].append({
                              'file':str(rel),
                              'source':label,
                              'existing_sha256':existing,
                              'incoming_sha256':incoming
                          })
                  else:
                      shutil.copy2(p,out)
                      report[f'{label}_added'].append(str(rel))

          merge(Path('/tmp/web_parts/n1'),'pt1')
          merge(Path('/tmp/web_parts/n2'),'pt2')

          Path('CineHUB_WEB/WEB_INTEGRATION_REPORT.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print('PT1 added:',len(report['pt1_added']))
          print('PT2 added:',len(report['pt2_added']))
          print('Identical:',len(report['identical']))
          print('Conflicts:',len(report['conflicts']))
          if report['conflicts']:
              print('CONFLICTS_FOUND — preserving both source ZIPs for analysis.')
          PY

      - name: Inventory extracted WEB before validation
        run: |
          set -euo pipefail
          {
            echo "=== PT1 ==="
            find /tmp/web_parts/n1 -maxdepth 3 -type f | sort
            echo "=== PT2 ==="
            find /tmp/web_parts/n2 -maxdepth 3 -type f | sort
            echo "=== MERGED ==="
            find CineHUB_WEB -maxdepth 4 -type f | sort
          } > CineHUB_WEB/WEB_SOURCE_INVENTORY.txt

      - name: Remove temporary integration reports
        run: |
          rm -f CineHUB_WEB/WEB_INTEGRATION_REPORT.json CineHUB_WEB/WEB_SOURCE_INVENTORY.txt

      - name: Commit integration snapshot for validation
        run: |
          set -euo pipefail
          git config user.name "CineHUB Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CineHUB_WEB
          git commit -m "web: snapshot PT1 + PT2 integration"
          git push

      - name: Validate WEB
        run: |
          set -euo pipefail
          test -f CineHUB_WEB/index.html || { echo "MISSING index.html"; exit 1; }
          test -f CineHUB_WEB/service-worker.js || { echo "MISSING service-worker.js"; exit 1; }
          test -f CineHUB_WEB/manifest.json || { echo "MISSING manifest.json"; exit 1; }
          test -d CineHUB_WEB/src/css || { echo "MISSING src/css"; exit 1; }
          test -d CineHUB_WEB/src/js || { echo "MISSING src/js"; exit 1; }
          test -d CineHUB_WEB/dados || { echo "MISSING dados"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          root=Path('CineHUB_WEB')
          files=[p for p in root.rglob('*') if p.is_file()]
          for ext in ('.html','.css','.js','.json','.m3u','.m3u8'):
              print(ext, sum(p.suffix.lower()==ext for p in files))
          print('TOTAL',len(files))
          PY

      - name: Verify Android TV remains isolated
        run: |
          set -euo pipefail
          test -f CineHUB_TV_Android/settings.gradle.kts
          echo "Android TV untouched by WEB integration."

      - name: Commit WEB comparison report
        run: |
          set -euo pipefail
          git config user.name "CineHUB Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CineHUB_WEB
          git commit -m "web: record PT1 + PT2 integration report"
          git push

      - name: Stop before ZIP deletion when conflicts exist
        if: hashFiles('CineHUB_WEB/WEB_INTEGRATION_REPORT.json') != ''
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('CineHUB_WEB/WEB_INTEGRATION_REPORT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('conflicts'):
              print(f"STOP: {len(d['conflicts'])} conflicts require analysis before ZIP deletion.")
              raise SystemExit(1)
          PY

      - name: Remove source ZIPs only after successful validation
        run: |
          set -euo pipefail
          git rm CineHUB_OFC-PT1.zip CineHUB_OFC-PT2.zip
          git commit -m "chore: remove WEB source ZIPs after validation"
          git push
