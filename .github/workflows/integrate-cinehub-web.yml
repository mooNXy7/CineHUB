name: Integrate CineHUB WEB

on:
  push:
    branches: [main]
    paths:
      - 'CineHUB_OFC-PT1.zip'
      - 'CineHUB_OFC-PT2.zip'
      - '.github/workflows/integrate-cinehub-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare
        run: |
          set -euo pipefail
          rm -rf /tmp/web_parts /tmp/web_part1 /tmp/web_part2
          mkdir -p /tmp/web_parts /tmp/web_part1 /tmp/web_part2
          unzip -q CineHUB_OFC-PT1.zip -d /tmp/web_part1
          unzip -q CineHUB_OFC-PT2.zip -d /tmp/web_part2

      - name: Normalize extracted roots
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def root_for(base):
              entries=[p for p in base.iterdir()]
              if len(entries)==1 and entries[0].is_dir():
                  return entries[0]
              return base
          for name in ('web_part1','web_part2'):
              base=Path('/tmp')/name
              root=root_for(base)
              target=Path('/tmp/web_parts')/name
              target.mkdir(parents=True, exist_ok=True)
              for p in root.iterdir():
                  dest=target/p.name
                  if p.is_dir():
                      import shutil
                      shutil.copytree(p,dest,dirs_exist_ok=True)
                  else:
                      import shutil
                      shutil.copy2(p,dest)
          PY

      - name: Compare and integrate
        run: |
          set -euo pipefail
          mkdir -p CineHUB_WEB
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, json

          dest=Path('CineHUB_WEB')
          stats={'added':[],'identical':[],'conflicts':[]}

          def digest(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          for part in ('web_part1','web_part2'):
              src=Path('/tmp/web_parts')/part
              for p in sorted(src.rglob('*')):
                  if not p.is_file():
                      continue
                  rel=p.relative_to(src)
                  out=dest/rel
                  out.parent.mkdir(parents=True, exist_ok=True)
                  if out.exists():
                      if digest(out)==digest(p):
                          stats['identical'].append(str(rel))
                      else:
                          stats['conflicts'].append(str(rel))
                  else:
                      shutil.copy2(p,out)
                      stats['added'].append(str(rel))

          Path('CineHUB_WEB/WEB_INTEGRATION_REPORT.json').write_text(
              json.dumps(stats,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          if stats['conflicts']:
              print('CONFLICTS:')
              print('\n'.join(stats['conflicts']))
              raise SystemExit(2)
          print(f"Added: {len(stats['added'])} | Identical: {len(stats['identical'])} | Conflicts: 0")
          PY

      - name: Validate WEB
        run: |
          set -euo pipefail
          test -f CineHUB_WEB/index.html
          test -f CineHUB_WEB/service-worker.js
          test -f CineHUB_WEB/manifest.json
          test -d CineHUB_WEB/src
          test -d CineHUB_WEB/dados
          python3 - <<'PY'
          from pathlib import Path
          root=Path('CineHUB_WEB')
          files=list(root.rglob('*'))
          print('WEB files:', sum(p.is_file() for p in files))
          print('HTML:', sum(p.suffix.lower()=='.html' for p in files))
          print('CSS:', sum(p.suffix.lower()=='.css' for p in files))
          print('JS:', sum(p.suffix.lower()=='.js' for p in files))
          print('M3U/M3U8:', sum(p.suffix.lower() in ('.m3u','.m3u8') for p in files))
          PY

      - name: Commit integrated WEB
        run: |
          set -euo pipefail
          git config user.name "CineHUB Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CineHUB_WEB
          if git diff --cached --quiet; then
            echo "No WEB changes to commit."
          else
            git commit -m "web: integrate CineHUB WEB PT1 + PT2"
            git push
          fi

      - name: Remove source ZIPs after successful integration
        run: |
          set -euo pipefail
          git config user.name "CineHUB Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm CineHUB_OFC-PT1.zip CineHUB_OFC-PT2.zip
          git commit -m "chore: remove WEB source ZIPs after successful integration"
          git push
