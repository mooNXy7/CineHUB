name: CineHUB-TV Android CI

on:
  push:
    branches: ["main", "tv-*"]
    paths:
      - "CineHUB_TV_Android/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "CineHUB_TV_Android/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: CINEHUB_TV
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
      CINEHUB_TV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      CINEHUB_TV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      CINEHUB_TV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore production signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing KEYSTORE_B64 in the CINEHUB_TV environment."; exit 1; }
          mkdir -p "$RUNNER_TEMP/cinehub-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cinehub-signing/cinehub-tv-release.jks"
          test -s "$RUNNER_TEMP/cinehub-signing/cinehub-tv-release.jks"
          echo "CINEHUB_TV_KEYSTORE_PATH=$RUNNER_TEMP/cinehub-signing/cinehub-tv-release.jks" >> "$GITHUB_ENV"

      - name: Validate signing configuration
        run: |
          set -euo pipefail
          test -n "${CINEHUB_TV_KEYSTORE_PASSWORD:-}" || { echo "Missing KEYSTORE_PASSWORD in the CINEHUB_TV environment."; exit 1; }
          test -n "${CINEHUB_TV_KEY_ALIAS:-}" || { echo "Missing KEY_ALIAS in the CINEHUB_TV environment."; exit 1; }
          test -n "${CINEHUB_TV_KEY_PASSWORD:-}" || { echo "Missing KEY_PASSWORD in the CINEHUB_TV environment."; exit 1; }
          keytool -list -keystore "$CINEHUB_TV_KEYSTORE_PATH" -storepass "$CINEHUB_TV_KEYSTORE_PASSWORD" -alias "$CINEHUB_TV_KEY_ALIAS" >/dev/null

      - name: Build production release APK
        working-directory: CineHUB_TV_Android
        run: gradle :CineHUB-TV:assembleRelease --no-daemon --stacktrace

      - name: Verify APK is production-signed
        run: |
          set -euo pipefail
          APK="$(find CineHUB_TV_Android/CineHUB-TV/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"
          "$APKSIGNER" verify "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload production APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineHUB-TV-v1.2.0-production
          path: ${{ env.APK }}
          retention-days: 30
