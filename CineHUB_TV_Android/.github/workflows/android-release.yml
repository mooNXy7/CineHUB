name: CineHUB-TV Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build release APK
        working-directory: CineHUB_TV_Android
        run: gradle :CineHUB-TV:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        working-directory: CineHUB_TV_Android
        run: |
          mkdir -p release
          cp CineHUB-TV/build/outputs/apk/release/CineHUB-TV-release.apk release/CineHUB-TV-${GITHUB_REF_NAME}.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: CineHUB_TV_Android/release/CineHUB-TV-${{ github.ref_name }}.apk
