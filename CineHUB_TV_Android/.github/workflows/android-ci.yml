name: CineHUB-TV Android CI

on:
  push:
    branches: ["main"]
    paths:
      - "CineHUB_TV_Android/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build release APK
        working-directory: CineHUB_TV_Android
        run: gradle :CineHUB-TV:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        working-directory: CineHUB_TV_Android
        run: test -s CineHUB-TV/build/outputs/apk/release/CineHUB-TV-release.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineHUB-TV-build
          path: CineHUB_TV_Android/CineHUB-TV/build/outputs/apk/release/CineHUB-TV-release.apk
          retention-days: 7
